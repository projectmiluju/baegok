name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client (API)
        run: cd apps/api && bunx prisma generate

      - name: Lint (TS/JS)
        run: bun run lint

      - name: Typecheck (API)
        run: cd apps/api && bun run typecheck

      - name: Typecheck (MCP)
        run: cd apps/mcp && bun run typecheck

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: cd apps/ai && pip install -r requirements.txt ruff black

      - name: Ruff check
        run: cd apps/ai && ruff check .

      - name: Black check
        run: cd apps/ai && black --check .

      - name: Python tests
        run: cd apps/ai && python -m pytest src/tests/ -v

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client (API)
        run: cd apps/api && bunx prisma generate

      - name: Run tests with coverage
        run: bun run test:coverage
