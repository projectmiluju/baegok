name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API 이미지 빌드 + 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:latest

      - name: Web 이미지 빌드 + 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://baegok.site

      - name: AI 이미지 빌드 + 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ai:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2 SSH 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/baegok
            git pull origin main
            docker compose --env-file .env.production -f docker-compose.prod.yml pull api web ai || true

            # 인프라 먼저 기동 (postgres, redis, kafka)
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis zookeeper kafka
            echo "Kafka 헬스체크 대기..."
            sleep 30

            # 앱 서비스 기동
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            sleep 10

            # Kafka 타이밍으로 실패한 서비스 재시도
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            sleep 5

            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api bunx prisma migrate deploy --schema apps/api/prisma/schema.prisma || true
            docker image prune -f
