services:
  # ── Nginx 리버스 프록시 ──
  nginx:
    image: nginx:alpine
    container_name: baegok-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  # ── Next.js 프론트엔드 ──
  web:
    image: ghcr.io/projectmiluju/baegok/web:latest
    container_name: baegok-web
    restart: unless-stopped
    expose:
      - "3000"

  # ── Hono API 서버 ──
  api:
    image: ghcr.io/projectmiluju/baegok/api:latest
    container_name: baegok-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=${PRISMA_DATABASE_URL}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── FastAPI AI 서버 ──
  ai:
    image: ghcr.io/projectmiluju/baegok/ai:latest
    container_name: baegok-ai
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── Celery Worker ──
  celery-worker:
    image: ghcr.io/projectmiluju/baegok/ai:latest
    container_name: baegok-celery-worker
    restart: unless-stopped
    command: celery -A src.celery_app worker --loglevel=info
    env_file:
      - .env.production
    depends_on:
      - ai

  # ── Celery Beat ──
  celery-beat:
    image: ghcr.io/projectmiluju/baegok/ai:latest
    container_name: baegok-celery-beat
    restart: unless-stopped
    command: celery -A src.celery_app beat --loglevel=info
    env_file:
      - .env.production
    depends_on:
      - ai

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: baegok-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-baegok}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-baegok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baegok"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: baegok-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Kafka ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: baegok-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: baegok-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
